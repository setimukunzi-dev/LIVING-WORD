<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVING WORD</title>
    <!-- Tämä lataa Tailwind CSS -tyylit sivullesi automaattisesti -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-neutral-900 text-white font-sans">

    <div class="h-56 bg-gradient-to-br from-neutral-800 to-neutral-700 flex items-center justify-center text-6xl">
        <!-- Voit laittaa tähän myöhemmin esim. logon tai otsikon -->
    </div>

    <div class="p-6">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-xl font-semibold">Esittelyvideo</h3>
            <span class="text-sm text-neutral-400">5:00</span>
        </div>

        <p class="text-neutral-400 mb-5">
            Engage your audience with impactful visual storytelling and meaningful discussions.
        </p>

        <button class="w-full bg-white text-black py-3 rounded-xl font-semibold hover:opacity-90 transition">
            Watch Video
        </button>
    </div>

    <section id="community" class="max-w-7xl mx-auto px-6 py-20">
        <div class="grid lg:grid-cols-2 gap-12 items-start">
            <div>
                <h2 class="text-4xl font-bold mb-4">Community Discussions</h2>
                <p class="text-neutral-400 text-lg leading-relaxed mb-8">
                    Create a safe and inspiring place where visitors can connect, discuss ideas, support one another, and grow together.
                </p>
            </div>
        </div>
    </section>

</body>
</html>
